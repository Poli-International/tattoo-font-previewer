    <script>
if (window.self !== window.top) {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.classList.add('dark');
    document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('dark-mode'); });
    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'poli-theme') {
            if (e.data.light) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                document.documentElement.classList.remove('dark');
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('poli-dark-mode', 'light');
                window.dispatchEvent(new StorageEvent('storage', { key: 'poli-dark-mode', newValue: 'light' }));
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                document.documentElement.classList.add('dark');
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('poli-dark-mode', 'dark');
                window.dispatchEvent(new StorageEvent('storage', { key: 'poli-dark-mode', newValue: 'dark' }));
            }
        }
    });
}
</script>
