  <script>
  if (window.self !== window.top) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.classList.add('dark');
      document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('dark-mode'); });
      window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'poli-theme') {
              if (e.data.light) {
                  document.body.classList.remove('dark-mode');
                  document.body.classList.add('light-mode');
                  document.documentElement.classList.remove('dark');
                  document.documentElement.setAttribute('data-theme', 'light');
                  try {
                      localStorage.setItem('poli-dark-mode', 'light');
                  } catch(err) {}
                  window.dispatchEvent(new StorageEvent('storage', { key: 'poli-dark-mode', newValue: 'light' }));
              } else {
                  document.body.classList.remove('light-mode');
                  document.body.classList.add('dark-mode');
                  document.documentElement.classList.add('dark');
                  document.documentElement.setAttribute('data-theme', 'dark');
                  try {
                      localStorage.setItem('poli-dark-mode', 'dark');
                  } catch(err) {}
                  window.dispatchEvent(new StorageEvent('storage', { key: 'poli-dark-mode', newValue: 'dark' }));
              }
          }
      });
  }
  </script>

  <style>
    :root {
      --tab-bg: #1a1a1a;
      --tab-border: #333333;
      --tab-active-bg: #6d28d9;
      --tab-active-text: #ffffff;
      --tab-inactive-bg: #222222;
      --tab-inactive-text: #d1d5db;
      --card-bg: #1a1a1a;
      --code-bg: #0f0f0f;
      --code-color: #34d399;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --border-subtle: #2d2d2d;
    }
    [data-theme="light"],
    body.light-mode {
      --tab-bg: #f3f4f6;
      --tab-border: #e5e7eb;
      --tab-active-bg: #6d28d9;
      --tab-active-text: #ffffff;
      --tab-inactive-bg: #e5e7eb;
      --tab-inactive-text: #374151;
      --card-bg: #ffffff;
      --code-bg: #f8fafc;
      --code-color: #065f46;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border-subtle: #e5e7eb;
    }
    body.dark-mode { background-color: #0D0D0D; color: #FFFFFF; }
    body.light-mode { background-color: #FFFFFF; color: #1A1A1A; }
    
    .tool-tabs-container {
      display: flex;
      background: var(--tab-bg);
      border-bottom: 2px solid var(--tab-border);
      position: relative;
      z-index: 50;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tool-tab-btn {
      flex: 1;
      min-height: 48px;
      padding: 0.75rem 1rem;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .tool-tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
    }
    .tool-tab-btn:not(.active) {
      background: var(--tab-inactive-bg);
      color: var(--tab-inactive-text);
    }
    .tool-tab-btn:not(.active):hover {
      background: #2a2a2a;
      color: #ffffff;
    }
    .wrapper-tab-content {
      width: 100%;
    }
    .embed-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      border: 1px solid var(--tab-border);
    }
    .embed-card h2 {
      color: #c084fc;
      margin-bottom: 1rem;
    }
    .embed-card p {
      color: var(--tab-inactive-text);
      margin-bottom: 1rem;
    }
    .embed-code-textarea {
      width: 100%;
      height: 120px;
      background: var(--code-bg);
      color: var(--code-color);
      border: 1px solid var(--tab-border);
      border-radius: 8px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: none;
    }
    .embed-copy-btn {
      margin-top: 1rem;
      min-height: 44px;
      padding: 0.75rem 1.75rem;
      background: var(--tab-active-bg);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .embed-copy-btn:hover {
      opacity: 0.9;
    }
    .docs-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }
    .docs-section {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .docs-heading {
      color: #a855f7;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .docs-text {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .docs-card-item {
      background: var(--code-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 1rem;
    }
    .docs-card-title {
      font-weight: 600;
      font-size: 0.875rem;
      color: #c084fc;
      margin-bottom: 0.25rem;
    }
    .hidden {
      display: none !important;
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 480px) {
      .tool-tab-btn {
        padding: 0.75rem 0.5rem;
        font-size: 0.85rem;
      }
      .embed-card {
        padding: 1.25rem 0.75rem;
        margin: 0 0.5rem;
      }
      .docs-container {
        padding: 0.5rem;
      }
      .docs-section {
        padding: 1rem;
      }
    }
    @media print {
      .tool-tabs-container,
      #toolTabsBar {
        display: none !important;
      }
    }
  </style>
  <script src="/js/input-guards.js"></script>
  <link rel="stylesheet" href="/tools/shared/print.css" media="print">

<body class="dark-mode">
  <!-- Top Navigation Tabs -->
  <div class="tool-tabs-container" id="toolTabsBar">
    <button class="tool-tab-btn active" data-tab="tool" data-i18n="tab.tool">Tool</button>
    <button class="tool-tab-btn" data-tab="docs" data-i18n="tab.docs">Documentation</button>
    <button class="tool-tab-btn" data-tab="embed" data-i18n="tab.embed">Embed Code</button>
  </div>

  <!-- Tab Content: Tool -->
  <div id="tab-tool" class="wrapper-tab-content">
    <main class="tool-main-content">
      <div id="root"></div>
    </main>
  </div>

  <!-- Tab Content: Documentation: the published guide, in the language the tool is set to -->
  <div id="tab-docs" class="wrapper-tab-content hidden">
    <iframe id="docsFrame" src="/tools/tattoo-font-previewer/documentation.html" data-i18n-title="tab.docsFrameTitle"
      title="Tattoo Font Previewer Documentation" loading="lazy"
      style="width: 100%; min-height: 80vh; border: 0; display: block;"></iframe>
  </div>

  <!-- Tab Content: Embed -->
  <div id="tab-embed" class="wrapper-tab-content hidden" style="padding: 2rem;">
    <div class="embed-card">
      <h2 data-i18n="tab.embedTitle">Embed This Tool</h2>
      <p data-i18n="tab.embedDesc">Copy the code below to embed this tool on your website:</p>
      <textarea id="embedCodeTab" class="embed-code-textarea" readonly>&lt;iframe src="https://poliinternational.com/tools/tattoo-font-previewer/index.html" width="100%" height="1000" frameborder="0" style="border-radius:12px;"&gt;&lt;/iframe&gt;</textarea>
      <div>
        <button id="tabCopyBtn" class="embed-copy-btn" onclick="copyEmbedCodeTab()" data-i18n="tab.copyBtn">Copy Code</button>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.tool-tab-btn').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tool-tab-btn').forEach(function(t) {
          t.classList.remove('active');
        });
        tab.classList.add('active');
        var tabName = tab.dataset.tab;
        document.querySelectorAll('.wrapper-tab-content').forEach(function(content) {
          content.classList.add('hidden');
        });
        var activeContent = document.getElementById('tab-' + tabName);
        if (activeContent) {
          activeContent.classList.remove('hidden');
        }
      });
    });

    function copyEmbedCodeTab() {
      var textarea = document.getElementById('embedCodeTab');
      if (textarea) {
        textarea.select();
        navigator.clipboard.writeText(textarea.value).then(function() {
          var btn = document.getElementById('tabCopyBtn');
          if (btn) {
            var oldText = btn.textContent;
            btn.textContent = (window.t ? window.t('tab.copied') : 'Copied!');
            setTimeout(function() {
              btn.textContent = oldText;
            }, 2000);
          }
        }).catch(function() {
          document.execCommand('copy');
        });
      }
    }
  </script>

  <script src="/tools/tattoo-font-previewer/js/vendor/opentype.min.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
